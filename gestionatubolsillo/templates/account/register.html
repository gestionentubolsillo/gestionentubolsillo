{% extends "navbar.html" %}
{% load static %}

{% block body %}
<section class="py-5 py-md-5" style="min-height: calc(100vh - 140px); display: flex; align-items: center;">
	<div class="container">
		<div class="row justify-content-center">
			<div class="col-12 col-lg-10 col-xl-9">
				<div class="card shadow-2-strong border-0" style="border-radius: 20px;">
					<div class="card-body p-4 p-md-5">
						<h1 class="mb-4 pb-2 pb-md-0 mb-md-4 display-4 fw-bold text-dark">Registro de usuario</h1>

						{% if messages %}
							{% for message in messages %}
								<div class="alert alert-danger" role="alert">
									{{ message }}
								</div>
							{% endfor %}
						{% endif %}

						<form method="post" action="/register">
							{% csrf_token %}
							<div class="row">
								<div class="col-12 col-md-6">
									<div class="mb-3">
										<label for="username" class="form-label fw-semibold">Usuario</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-user"></i></span>
											<input type="text" class="form-control" id="username" name="username" placeholder="Nombre de usuario" required maxlength="150">
										</div>
									</div>

									<div class="mb-3">
										<label for="password" class="form-label fw-semibold">Contraseña</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-lock"></i></span>
											<input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required maxlength="128">
										</div>
									</div>

									<div class="mb-3">
										<label for="password_confirm" class="form-label fw-semibold">Confirmar contraseña</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-lock"></i></span>
											<input type="password" class="form-control" id="password_confirm" name="password_confirm" placeholder="Repite la contraseña" required maxlength="128">
										</div>
									</div>

									<div class="mb-3">
										<label for="nombre" class="form-label fw-semibold">Nombre</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-user"></i></span>
											<input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre" maxlength="150">
										</div>
									</div>

									<div class="mb-3">
										<label for="apellidos" class="form-label fw-semibold">Apellidos</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-id-badge"></i></span>
											<input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Apellidos" maxlength="150">
										</div>
									</div>

									<div class="mb-3">
										<label for="mail" class="form-label fw-semibold">Email</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-envelope"></i></span>
											<input type="email" class="form-control" id="mail" name="mail" placeholder="Correo electrónico">
										</div>
									</div>

									<div class="mb-3">
										<label for="telefono" class="form-label fw-semibold">Teléfono</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-phone"></i></span>
											<input type="text" class="form-control" id="telefono" name="telefono" placeholder="Teléfono" maxlength="30">
										</div>
									</div>
								</div>

								<div class="col-12 col-md-6">
									<div class="mb-3">
										<label for="direccion" class="form-label fw-semibold">Dirección</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
											<input type="text" class="form-control" id="direccion" name="direccion" placeholder="Dirección">
										</div>
									</div>

									<div class="mb-3">
										<label for="provincia" class="form-label fw-semibold">Provincia</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-flag"></i></span>
											<input type="text" class="form-control" id="provincia" name="provincia" placeholder="Provincia">
										</div>
									</div>

									<div class="mb-3">
										<label for="municipio" class="form-label fw-semibold">Municipio</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-city"></i></span>
											<input type="text" class="form-control" id="municipio" name="municipio" placeholder="Municipio">
										</div>
									</div>

									<div class="mb-3">
										<label for="nif" class="form-label fw-semibold">NIF / CIF</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-id-card"></i></span>
											<input type="text" class="form-control" id="nif" name="nif" placeholder="NIF o CIF" maxlength="20">
										</div>
									</div>

									<div class="mb-3">
										<label for="categoria" class="form-label fw-semibold">Categoría</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-briefcase"></i></span>
											<select class="form-select" id="categoria" name="categoria">
												<option value="ejecutivo" selected>Ejecutivo</option>
												<option value="tecnico">Técnico</option>
												<option value="otro">Otro</option>
											</select>
										</div>
									</div>

									<div class="mb-3">
										<label for="precio_hora" class="form-label fw-semibold">Precio por hora</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-euro-sign"></i></span>
											<input type="number" step="0.01" class="form-control" id="precio_hora" name="precio_hora" placeholder="0.00">
										</div>
									</div>
								</div>
							</div>

							<hr>

							<h5 class="mb-3 fw-semibold">Empresa</h5>
							<div class="row">
								<div class="col-12 col-md-6">
									<div class="mb-3">
										<label for="name" class="form-label fw-semibold">Nombre de la empresa</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-building"></i></span>
											<input type="text" class="form-control" id="name" name="name" placeholder="Nombre de la empresa">
										</div>
									</div>
								</div>
								<div class="col-12 col-md-6">
									<div class="mb-3">
										<label for="paquete" class="form-label fw-semibold">Paquete</label>
										<div class="input-group">
											<span class="input-group-text"><i class="fas fa-box"></i></span>
											<select class="form-select" id="paquete" name="paquete">
												{% for value, display in paquetes %}
													<option value="{{ value }}">{{ display }}</option>
												{% endfor %}
											</select>
										</div>
									</div>
								</div>
							</div>

							<div class="mt-4 pt-2 d-flex justify-content-end">
								<input class="btn btn-primary btn-lg px-4" type="submit" value="Registrar" style="border-radius: 2rem;">
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

{% include "footer.html" %}
{% endblock %}
