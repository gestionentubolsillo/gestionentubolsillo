{%  extends "navbar.html" %}
{% load static %}

{% block body %}
<section class="py-5 py-md-5" style="min-height: calc(100vh - 140px); display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 col-xl-7">
                <div class="card shadow-2-strong border-0" style="border-radius: 20px;">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="mb-4 pb-2 pb-md-0 mb-md-4 display-4 fw-bold text-dark">Iniciar sesión</h1>

                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-danger" role="alert">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="post" action="/login">
                            {% csrf_token %}
                            <div class="row justify-content-center">
                                <div class="col-12 col-md-8">
                                    <div class="mb-3">
                                        <label for="username" class="form-label fw-semibold">Usuario</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                                            <input type="text" class="form-control" id="username" name="username" placeholder="Introduce tu nombre de usuario" required maxlength="150">
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                            <input type="password" class="form-control" id="password" name="password" placeholder="Introduce tu contraseña" required maxlength="128">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4 pt-2 text-center">
                                <input class="btn btn-primary btn-lg px-4" type="submit" value="Iniciar sesión" style="border-radius: 2rem;">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% include "footer.html" %}
{% endblock %}
